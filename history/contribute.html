          <h1>📝 如何投稿</h1>
          <p>欢迎向班史编纂委员会投稿！投稿内容可为班级趣事、人物轶事、重大事件等。</p>
          <h2>投稿方式</h2>
          <ul>
            <li>发送邮件至：<span class="info-page__mono">qingranoffice@icloud.com</span></li>
            <li>或联系编委会成员直接提交（见“加入我们”获取联系方式）</li>
          </ul>
          <h2>投稿要求</h2>
          <ul>
            <li>内容真实、语言生动，可采用文言或白话。</li>
            <li>涉及人物请使用真实姓名或常用昵称。</li>
            <li>可附带图片、截图等素材。</li>
          </ul>
          <p class="info-page__note">📬 我们会在收到投稿后 5 个工作日内审核回复。</p>
